<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animation Playground</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- 1.1.1 / 1.3.1: main landmark wraps the canvas; label updated by JS when sketch changes -->
  <main id="canvas-container" aria-label="Generative animation canvas"></main>

  <!-- 1.3.1: toolbar role + accessible label for the control group -->
  <div id="transport" role="toolbar" aria-label="Playback controls">

    <!-- 4.1.2: aria-label overrides emoji text for AT; aria-pressed tracks toggle state -->
    <button id="btn-play"
            aria-label="Pause animation"
            aria-pressed="false">⏸ Pause</button>

    <!-- 1.3.1: purely decorative, hidden from the accessibility tree -->
    <div class="divider" aria-hidden="true"></div>

    <button id="btn-record"
            aria-label="Start recording"
            aria-pressed="false">⏺ Record</button>

    <!-- 4.1.3: polite live region so screen readers announce timer updates -->
    <span id="record-timer"
          aria-live="polite"
          aria-atomic="true"></span>
  </div>

  <!-- 4.1.3: assertive region for one-shot state changes (recording start/stop) -->
  <span id="sr-status" class="sr-only" aria-live="assertive" aria-atomic="true"></span>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
